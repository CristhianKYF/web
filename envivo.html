        body {
            background: linear-gradient(180deg, #0d0d0d, #1a1a1a, #000);
            color: white;
            font-family: 'Segoe UI', sans-serif;
        }
        .player-card {
            background: #141414;
            border-radius: 20px;
            padding: 35px;

            border: 1px solid rgba(255,255,255,0.06);
        }
        h1, h4 {
            letter-spacing: 1px;
        }
        .btn-live {
            background: #ff1f1f;
            color: white;
            border: none;
            font-size: 18px;
            padding: 14px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .btn-live:hover {
            background: #d41616;
            transform: scale(1.03);
        }
        .live-dot {
            height: 12px;
            width: 12px;
            background: red;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.3; }
            100% { opacity: 1; }
        }
    </style>
